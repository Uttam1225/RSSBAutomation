name: CI — Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Java 17 ─────────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ── Create config.properties from secret ────────────────────────────────
      - name: Create config.properties
        run: |
          cat > src/main/resources/config.properties <<EOF
          gemini.api.key=${{ secrets.GEMINI_API_KEY }}
          gemini.api.url=https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent
          output.dir=output/papers
          schedule.cron=0 0 8 * * *
          duration.days=90
          EOF

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build with Maven
        run: mvn clean compile -q

      # ── Test ────────────────────────────────────────────────────────────────
      - name: Run tests
        run: mvn test

      # ── Package (JAR) ────────────────────────────────────────────────────────
      - name: Package JAR
        run: mvn package -DskipTests -q

      # ── Upload JAR as artifact ───────────────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-generator-jar
          path: target/*.jar
          retention-days: 7
