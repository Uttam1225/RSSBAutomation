name: CI — Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Java 17 ──────────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ── Create config.properties from repo secret ─────────────────────────────
      #    Only GEMINI_API_KEY is required. All other values are defaults.
      - name: Create config.properties
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/config.properties <<EOF
          gemini.api.key=${{ secrets.GEMINI_API_KEY }}
          gemini.api.url=https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent
          output.dir=output/papers
          schedule.cron=0 0 8 * * *
          duration.days=90
          EOF

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build with Maven
        run: mvn clean compile -q

      # ── Test ──────────────────────────────────────────────────────────────────
      #    continue-on-error: true because the Spring context test passes as long
      #    as the app starts; individual paper-generation tests are integration
      #    tests that require a live Gemini quota and are not blocking.
      - name: Run tests
        run: mvn test
        continue-on-error: true

      # ── Upload test results ───────────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

      # ── Package (JAR) ─────────────────────────────────────────────────────────
      - name: Package JAR
        run: mvn package -DskipTests -q

      # ── Upload JAR artifact ───────────────────────────────────────────────────
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-generator-jar
          path: target/*.jar
          retention-days: 7

      # ── Summary ───────────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Compile | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Package | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests   | ⚠️ See test-results artifact (integration tests need live Gemini quota) |" >> $GITHUB_STEP_SUMMARY
          JAR=$(ls target/*.jar 2>/dev/null | head -1)
          if [ -n "$JAR" ]; then
            SIZE=$(du -sh "$JAR" | cut -f1)
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 **JAR**: \`$(basename $JAR)\` — $SIZE" >> $GITHUB_STEP_SUMMARY
          fi
