name: Release — Build & Publish JAR

on:
  push:
    tags:
      - 'v*.*.*'   # triggers on tags like v1.0.0, v1.2.3

jobs:
  release:
    name: Build & Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to create GitHub Release

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Java 17 ─────────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ── Extract version from tag ─────────────────────────────────────────────
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # ── Create config.properties ─────────────────────────────────────────────
      - name: Create config.properties
        run: |
          cat > src/main/resources/config.properties <<EOF
          gemini.api.key=${{ secrets.GEMINI_API_KEY }}
          gemini.api.url=https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent
          output.dir=output/papers
          schedule.cron=0 0 8 * * *
          duration.days=90
          EOF

      # ── Build JAR ────────────────────────────────────────────────────────────
      - name: Build JAR
        run: mvn clean package -DskipTests -q

      # ── Rename JAR with version ───────────────────────────────────────────────
      - name: Rename JAR
        run: |
          mv target/paper-generator-*.jar target/paper-generator-${{ steps.version.outputs.VERSION }}.jar

      # ── Create GitHub Release ────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            ## RSSB Paper Generator ${{ github.ref_name }}

            ### What's in this release
            - Bilingual (English + Hindi) MCQ paper generation
            - Google Gemini 2.5 Flash integration
            - Apache PDFBox rendering with NotoSans fonts
            - Daily scheduler with duplicate prevention

            ### How to run
            ```bash
            # Copy and fill in your API key
            cp config.properties.example src/main/resources/config.properties

            # Run the JAR
            java -jar paper-generator-${{ steps.version.outputs.VERSION }}.jar
            ```
          files: target/paper-generator-${{ steps.version.outputs.VERSION }}.jar
          draft: false
          prerelease: false
